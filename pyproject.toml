[project]
name = "cardigan"
version = "0.1.0"
description = "Cardigan: a markdown editor that shows your outline as a kanban board"
requires-python = ">=3.10"
dependencies = ["PySide6"]

[project.scripts]
cardigan = "cardigan.__main__:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cardigan", "cardigan.editor"]

[tool.setuptools.package-data]
cardigan = ["icon.svg"]
